# MangoHud: FPS, temperatura e uso na tela dos jogos (Catppuccin Mocha).
# Ligado em ~/.config/MangoHud. Steam: "mangohud %command%".
# Atalhos: Shift direito + F12 liga/desliga | Shift direito + F11 troca o canto
#          Shift esquerdo + F1 alterna o limite de FPS (sem limite, 30, 60)
# Referência de todas as opções: /usr/share/doc/mangohud/MangoHud.conf.example

################ Aparência ################
legacy_layout=false
position=top-left
round_corners=10
background_alpha=0.6
background_color=1e1e2e
text_color=cdd6f4
font_file=/usr/share/fonts/TTF/FiraCodeNerdFont-Regular.ttf
font_size=20
text_outline

################ FPS ################
fps
fps_color_change
fps_value=30,60
fps_color=f38ba8,f9e2af,a6e3a1
frametime
frame_timing
frametime_color=a6e3a1
fps_limit=0,30,60
fps_limit_method=late

################ GPU (Vega integrada) ################
gpu_stats
gpu_temp
gpu_load_change
gpu_text=GPU
gpu_color=a6e3a1

################ CPU ################
cpu_stats
cpu_temp
cpu_load_change
cpu_text=CPU
cpu_color=89b4fa

################ Memória ################
# A GPU integrada usa a RAM: "vram" é a parte reservada (UMA 4 GB) em uso.
vram
vram_color=cba6f7
ram
ram_color=f5c2e7

################ Notebook ################
battery
battery_icon
battery_color=fab387
gamemode
engine_color=f38ba8

################ Atalhos ################
toggle_hud=Shift_R+F12
toggle_hud_position=Shift_R+F11
toggle_fps_limit=Shift_L+F1
