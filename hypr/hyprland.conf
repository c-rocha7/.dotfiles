
################
### MONITORS ###
################

monitor = DP-1,1920x1080@239.96,0x0,1
monitor = DP-2,1920x1080@239.96,-1920x0,1


###################
### MY PROGRAMS ###
###################

$terminal = kitty
$fileManager = dolphin
$menu = rofi -show drun -disable-history


#################
### AUTOSTART ###
#################

# System
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

# Dolphin
exec-once = kbuildsycoca6

# Polkit
exec-once = /usr/lib/polkit-kde-authentication-agent-1

# Clipvault
exec-once = wl-paste --type text --watch clipvault store
exec-once = wl-paste --type image --watch clipvault store

# Network Manager Applet
exec-once = nm-applet --indicator

# Waybar
exec-once = waybar

# Swaync
exec-once = swaync

# Swww
exec-once = swww init

# Waypaper
exec-once = waypaper --restore

#############################
### ENVIRONMENT VARIABLES ###
#############################

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

# XDG Specifications
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

# Qt Variables
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_QPA_PLATFORMTHEME,qt6ct

# Toolkit Backend Variables
env = GDK_BACKEND,wayland,x11,*
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland

# Dolphin
env = XDG_MENU_PREFIX,arch-

# Mozilla
env = MOZ_ENABLE_WAYLAND,1

# Hyprshot
env = HYPRSHOT_DIR, $HOME/Imagens/prints

#####################
### LOOK AND FEEL ###
#####################

general {
    gaps_in = 1
    gaps_out = 4

    border_size = 2

    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)

    resize_on_border = false

    allow_tearing = false

    layout = dwindle
}

decoration {
    rounding = 0
    rounding_power = 2

    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = true
        size = 3
        passes = 1

        vibrancy = 0.1696
    }
}

animations {
    enabled = yes, please :)

    #        NAME,           X0,   Y0,   X1,   Y1
    bezier = easeOutQuint,   0.23, 1,    0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear,         0,    0,    1,    1
    bezier = almostLinear,   0.5,  0.5,  0.75, 1
    bezier = quick,          0.15, 0,    0.1,  1

    #           NAME,          ONOFF, SPEED, CURVE,        [STYLE]
    animation = global,        1,     10,    default
    animation = border,        1,     5.39,  easeOutQuint
    animation = windows,       1,     4.79,  easeOutQuint
    animation = windowsIn,     1,     4.1,   easeOutQuint, popin 87%
    animation = windowsOut,    1,     1.49,  linear,       popin 87%
    animation = fadeIn,        1,     1.73,  almostLinear
    animation = fadeOut,       1,     1.46,  almostLinear
    animation = fade,          1,     3.03,  quick
    animation = layers,        1,     3.81,  easeOutQuint
    animation = layersIn,      1,     4,     easeOutQuint, fade
    animation = layersOut,     1,     1.5,   linear,       fade
    animation = fadeLayersIn,  1,     1.79,  almostLinear
    animation = fadeLayersOut, 1,     1.39,  almostLinear
    animation = workspaces,    1,     1.94,  almostLinear, fade
    animation = workspacesIn,  1,     1.21,  almostLinear, fade
    animation = workspacesOut, 1,     1.94,  almostLinear, fade
    animation = zoomFactor,    1,     7,     quick
}

dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = -1
    disable_hyprland_logo = false
}


#############
### INPUT ###
#############

input {
    kb_layout = br
    kb_variant = abnt2
    kb_model = abnt2
    kb_options =
    kb_rules =

    repeat_rate = 25
    repeat_delay = 600

    follow_mouse = 1

    sensitivity = 0

    numlock_by_default = true

    touchpad {
        natural_scroll = false
    }
}

gesture = 3, horizontal, workspace

device {
    name = lxddz-2.4g-8k-hs-receiver--1
    # name = kingston-hyperx-pulsefire-haste
    sensitivity = 0

    accel_profile = flat
}


###################
### KEYBINDINGS ###
###################

$mainMod = SUPER
$shiftMod = SUPER SHIFT
$controlMod = SUPER CONTROL

bind = $mainMod, T, exec, $terminal
bind = $mainMod, Q, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, S, togglefloating,
bind = $mainMod, Space, exec, $menu
bind = $mainMod, J, togglesplit,
bind = $mainMod, F, fullscreen, 1
bind = $shiftMod, F, fullscreen

# Clipvault
bind = $mainMod, V, exec, clipvault list | rofi -dmenu -display-columns 2 | clipvault get | wl-copy
bind = $shiftMod, W, exec, bash -c "clipvault clear && notify-send 'Clipvault' 'Histórico limpo!'"

# Hyprlock
bind = $mainMod, L, exec, hyprlock

# Waybar
bind = $shiftMod, Escape, exec, killall waybar || waybar

# Hyprshot
## Captura de uma janela
bind = $mainMod, PRINT, exec, hyprshot -m window

## Captura de um monitor
bind = $shiftMod, PRINT, exec, hyprshot -m output

## Captura de uma região
bind = , PRINT, exec, hyprshot -m region

# wLogout
bind = $mainMod, X, exec, wlogout --buttons-per-row 4

# Yazi
bind = $mainMod, Y, exec, kitty yazi

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

##############################
### WINDOWS AND WORKSPACES ###
##############################

workspace=1,monitor:DP-1
workspace=2,monitor:DP-1
workspace=3,monitor:DP-1
workspace=4,monitor:DP-1
workspace=5,monitor:DP-1

workspace=6,monitor:DP-2
workspace=7,monitor:DP-2
workspace=8,monitor:DP-2
workspace=9,monitor:DP-2
workspace=10,monitor:DP-2

windowrule = suppressevent maximize, class:.*

windowrule = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0

# Pavucontrol
windowrule = float,class:(.*org.pulseaudio.pavucontrol.*)
windowrule = size 800 700,class:(.*org.pulseaudio.pavucontrol.*)
windowrule = center,class:(.*org.pulseaudio.pavucontrol.*)

# Gnome Calculator
windowrule = float,class:(.*org.gnome.Calculator.*)
windowrule = size 400 600,class:(.*org.gnome.Calculator.*)
windowrule = center,class:(.*org.gnome.Calculator.*)

# Gnome Calendar
windowrule = float,class:(.*org.gnome.Calendar.*)
windowrule = size 1200 800,class:(.*org.gnome.Calendar.*)
windowrule = center,class:(.*org.gnome.Calendar.*)

# Gnome Clocks
windowrule = float,class:(.*org.gnome.clocks.*)
windowrule = size 500 350,class:(.*org.gnome.clocks.*)
windowrule = center,class:(.*org.gnome.clocks.*)

# Mission Center
windowrule = float,class:(.*io.missioncenter.MissionCenter.*)
windowrule = size 1280 900,class:(.*io.missioncenter.MissionCenter.*)
windowrule = center,class:(.*io.missioncenter.MissionCenter.*)

# Flatseal
windowrule = float,class:(.*com.github.tchx84.Flatseal.*)
windowrule = size 1200 800,class:(.*com.github.tchx84.Flatseal.*)
windowrule = center,class:(.*com.github.tchx84.Flatseal.*)

# QView
windowrule = float,class:(.*com.interversehq.qView.*)
windowrule = size 1200 800,class:(.*com.interversehq.qView.*)
windowrule = center,class:(.*com.interversehq.qView.*)

# Add Water
windowrule = float,class:(.*dev.qwery.AddWater.*)
windowrule = size 800 900,class:(.*dev.qwery.AddWater.*)
windowrule = center,class:(.*dev.qwery.AddWater.*)
