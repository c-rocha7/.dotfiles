# Luz noturna (hyprsunset): muda a cor da tela conforme o horário.
# Iniciado pelo hyprland.lua. Para testar agora: pkill hyprsunset; hyprsunset --verbose

max-gamma = 150

# Dia: cores normais
profile {
    time = 7:00
    identity = true
}

# Fim de tarde: levemente mais quente
profile {
    time = 19:00
    temperature = 5000
}

# Noite: mais quente, para descansar a vista
profile {
    time = 22:00
    temperature = 3800
}
