general {
    ignore_empty_input = true
}

background {
    monitor =
    path = $HOME/Imagens/wallpapers/rubiks-cube.png
}

input-field {
    monitor = DP-1
    size = 200, 50
    outline_thickness = 3
    dots_size = 0.33
    dots_spacing = 0.15
    dots_center = true
    dots_rounding = -1
    fade_on_empty = true
    fade_timeout = 1000
    placeholder_text =
    hide_input = false
    rounding = 40
    font_family = FantasqueSansM Nerd Font
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    fail_transition = 300
    capslock_color = -1
    numlock_color = -1
    bothlock_color = -1
    invert_numlock = false
    swap_font_color = false
    position = 0, -500
    halign = center
    valign = center
    shadow_passes = 10
    shadow_size = 20
    shadow_boost = 1.6
}

label { 
    monitor = DP-1
    text = cmd[update:1000] echo "$TIME"
    color = rgba(255, 255, 255, 0.9)
    font_size = 60
    font_family = FantasqueSansM Nerd Font
    position = 0, 400
    halign = center
    valign = center
    shadow_passes = 10
    shadow_size = 20
    shadow_boost = 1.6
}
