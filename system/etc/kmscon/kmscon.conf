# kmscon: console com fonte TrueType e paleta própria. Usado pelo ly (ly-kmsconvt@tty2).
# Instalado por install/ly.sh. Fonte e tamanho iguais aos do sistema: FiraCode Nerd Font 12 pt
# a 96 dpi = 16 px. Paleta: Catppuccin Mocha (o ly escolhe as cores por índice, full_color = false).
# Formato das cores: "r, g, b" (0-255).

# Teclado ABNT2 (sem isso o kmscon usa o americano: símbolos e acentos da senha mudam de tecla).
# O kmscon não tem opção de Num Lock ligado: "numpad:mac" faz o teclado numérico sempre digitar números.
xkb-model=abnt2
xkb-layout=br
xkb-options=numpad:mac

font-engine=pango
font-name=FiraCode Nerd Font Mono
font-size=16

palette=custom
palette-black=30, 30, 46
palette-red=243, 139, 168
palette-green=166, 227, 161
palette-yellow=249, 226, 175
palette-blue=137, 180, 250
palette-magenta=203, 166, 247
palette-cyan=148, 226, 213
palette-light-grey=186, 194, 222
palette-dark-grey=88, 91, 112
palette-light-red=243, 139, 168
palette-light-green=166, 227, 161
palette-light-yellow=249, 226, 175
palette-light-blue=137, 180, 250
palette-light-magenta=245, 194, 231
palette-light-cyan=148, 226, 213
palette-white=205, 214, 244
palette-foreground=205, 214, 244
palette-background=30, 30, 46
