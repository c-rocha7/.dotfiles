# smartd: vigia a saúde do SSD NVMe (Neo Forza, /dev/nvme0). Instalado por install/ssd-saude.sh.
# Depois de mudar: sudo systemctl restart smartd
#
# -a                   tudo: saúde geral, avisos críticos, log de erros, desgaste e reserva
# -W 4,70,75           temperatura: registra variações de 4 °C, avisa em 70 °C, crítico em 75 °C
# -m <nomailer> -M exec  sem e-mail: chama o script que manda a notificação para a ilha
# -M diminishing       repete o mesmo aviso com intervalo cada vez maior (1, 2, 4... dias)
/dev/nvme0 -a -W 4,70,75 -m <nomailer> -M exec /etc/smartmontools/smartd-notificar.sh -M diminishing
