# O serviço do pacote força "--font-engine unifont" (fonte bitmap) na linha de comando, que
# passa por cima do /etc/kmscon/kmscon.conf. Aqui a linha é a mesma, sem essa opção, e com a
# pasta de config explícita. Instalado por install/ly.sh.
[Service]
ExecStart=
ExecStart=/usr/bin/kmscon --configdir /etc/kmscon --vt=%I --seats=seat0 --login -- /usr/bin/ly-dm --use-kmscon-vt
