# Dentro do kmscon o ly não troca a tela para o terminal dele (o ly comum faz isso). Com o
# Plymouth, o boot termina no tty1 (login em texto) e o ly fica escondido no tty2: troca antes.
# Só para o tty2 (testes no tty3 não puxam a tela). Instalado por install/ly.sh.
[Service]
ExecStartPre=-/usr/bin/chvt 2
