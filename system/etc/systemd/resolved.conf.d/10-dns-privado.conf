# DNS criptografado (DNS over TLS) para todas as redes. Instalado por install/rede-impressora.sh.
# "opportunistic": usa TLS sempre que a rede deixa; se bloquearem a porta 853, cai para o DNS
# normal sozinho (Wi-Fi de hotel/aeroporto com página de login continua funcionando).
# Conferir: resolvectl status   |   Testar: resolvectl query archlinux.org
[Resolve]
DNS=9.9.9.9#dns.quad9.net 149.112.112.112#dns.quad9.net 2620:fe::fe#dns.quad9.net 2620:fe::9#dns.quad9.net
FallbackDNS=1.1.1.1#cloudflare-dns.com 1.0.0.1#cloudflare-dns.com 2606:4700:4700::1111#cloudflare-dns.com
# "~." = estes servidores valem para todos os nomes (no lugar do DNS que o roteador oferece)
Domains=~.
DNSOverTLS=opportunistic
# Nomes .local e impressoras ficam com o avahi (evita os dois disputarem a porta 5353)
MulticastDNS=no
LLMNR=no
