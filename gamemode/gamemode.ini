; GameMode: otimizações enquanto um jogo roda (Steam: "gamemoderun %command%").
; Ligado em ~/.config/gamemode.ini. Requer o usuário no grupo "gamemode".
; Testar: gamemoded -t   |   Ver se está ativo: gamemoded -s

[general]
; Mantém o governor do amd-pstate-epp ("powersave" = controlado por EPP).
; Quem sobe o desempenho é o power-profiles-daemon, trocado pela ilha (hook.sh).
; Com "performance" aqui, o GameMode passaria por cima do perfil de energia.
desiredgov=powersave

; Prioridade de CPU (nice -10) e de disco para o jogo.
renice=10
ioprio=0

; SCHED_ISO não existe no linux-zen: desligado para não gerar erro.
softrealtime=off

; Não deixa o hypridle bloquear/apagar a tela durante o jogo.
inhibit_screensaver=1

; [gpu]: o GameMode só aceita essa seção no /etc/gamemode.ini. Fica de fora de propósito:
; na APU (Vega) a GPU e a CPU dividem o mesmo limite de energia, então forçar o clock
; da GPU no máximo pode tirar desempenho da CPU. O clock da GPU fica no automático.

[custom]
; Avisa a ilha (Quickshell), que liga o perfil Desempenho e volta ao anterior no fim.
start=$HOME/.dotfiles/gamemode/hook.sh start
end=$HOME/.dotfiles/gamemode/hook.sh end
script_timeout=10
